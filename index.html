

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">

  <title>GOLDEN — Connect with your world</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {

      --gold: #f5c542;

      --bg: #080808;

      --panel: #151515;

      --text: #ffffff;

      --muted: #a7a7a7;

      --border: #303030;

    }

    * { box-sizing: border-box; }

    body {

      margin: 0;

      background: var(--bg);

      color: var(--text);

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }

    button, input, textarea { font: inherit; }

    button {

      cursor: pointer;

      border: 0;

      border-radius: 10px;

      padding: 12px 16px;

      font-weight: 700;

    }

    button:disabled { opacity: .6; cursor: wait; }

    .gold-btn {

      background: var(--gold);

      color: #111;

    }

    .dark-btn {

      background: #292929;

      color: white;

      border: 1px solid #404040;

    }

    header {

      background: #101010;

      border-bottom: 1px solid var(--border);

      padding: 15px 18px;

      position: sticky;

      top: 0;

      z-index: 5;

    }

    .header-inner {

      max-width: 700px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

    }

    .brand {

      color: var(--gold);

      font-size: 25px;

      font-weight: 900;

      letter-spacing: 3px;

    }

    .tagline {

      font-size: 11px;

      color: var(--muted);

      margin-top: 3px;

    }

    main {

      max-width: 620px;

      margin: 25px auto;

      padding: 0 14px 50px;

    }

    .panel {

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 18px;

    }

    h2 { margin: 0 0 8px; }

    h3 { margin: 0 0 14px; }

    .muted { color: var(--muted); font-size: 14px; }

    label {

      display: block;

      margin: 14px 0 7px;

      font-size: 13px;

      color: #ddd;

    }

    input, textarea {

      width: 100%;

      background: #090909;

      color: white;

      border: 1px solid #383838;

      border-radius: 10px;

      padding: 13px;

      outline: none;

    }

    input:focus, textarea:focus { border-color: var(--gold); }

    textarea {

      min-height: 100px;

      resize: vertical;

    }

    .full { width: 100%; margin-top: 15px; }

    .switch {

      color: var(--gold);

      background: transparent;

      padding: 5px;

    }

    .message {

      display: none;

      padding: 12px;

      border-radius: 9px;

      margin: 12px 0;

      font-size: 14px;

      overflow-wrap: anywhere;

    }

    .message.error { display: block; background: #3a1717; color: #ffbaba; }

    .message.success { display: block; background: #17351e; color: #b7ffc5; }

    .hidden { display: none !important; }

    .post {

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 15px;

      padding: 17px;

      margin-bottom: 14px;

      overflow-wrap: anywhere;

    }

    .post-head {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 13px;

    }

    .avatar {

      width: 42px;

      height: 42px;

      background: #302710;

      color: var(--gold);

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 900;

      flex-shrink: 0;

    }

    .post-name { font-weight: 700; }

    .post-time { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .post-content { white-space: pre-wrap; line-height: 1.55; }

    .post-actions {

      border-top: 1px solid var(--border);

      margin-top: 14px;

      padding-top: 12px;

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }

    .post-actions button { padding: 9px 12px; }

    .status {

      color: var(--muted);

      text-align: center;

      padding: 25px 10px;

    }

    footer {

      color: #777;

      text-align: center;

      font-size: 12px;

      padding: 20px;

    }

    @media (max-width: 480px) {

      main { margin-top: 16px; }

      .panel { padding: 16px; }

      .brand { font-size: 22px; }

    }

  </style>

</head>

<body>

  <header>

    <div class="header-inner">

      <div>

        <div class="brand">GOLDEN</div>

        <div class="tagline">Connect. Share. Shine.</div>

      </div>

      <button id="logoutBtn" class="dark-btn hidden" type="button">

        Log out

      </button>

    </div>

  </header>

  <main>

    <section id="authSection" class="panel">

      <h2 id="authTitle">Join GOLDEN</h2>

      <p class="muted" id="authSubtitle">

        Create your account and connect with people.

      </p>

      <div id="authMessage" class="message"></div>

      <form id="authForm">

        <div id="usernameField">

          <label for="username">Username</label>

          <input id="username" type="text" minlength="3" maxlength="24"

            autocomplete="username" placeholder="Choose a username" required>

        </div>

        <label for="email">Email address</label>

        <input id="email" type="email" autocomplete="email"

          placeholder="you@example.com" required>

        <label for="password">Password</label>

        <input id="password" type="password" minlength="6"

          autocomplete="current-password" placeholder="At least 6 characters"

          required>

        <button id="authSubmit" class="gold-btn full" type="submit">

          Create account

        </button>

      </form>

      <p class="muted" style="text-align:center;margin-top:18px">

        <span id="switchText">Already have an account?</span>

        <button id="switchAuth" class="switch" type="button">Log in</button>

      </p>

    </section>

    <section id="appSection" class="hidden">

      <div class="panel">

        <h2 id="welcomeTitle">Welcome to GOLDEN</h2>

        <p class="muted">Share your thoughts with the community.</p>

      </div>

      <div class="panel">

        <h3>Create a post</h3>

        <div id="postMessage" class="message"></div>

        <form id="postForm">

          <textarea id="postContent" maxlength="2000"

            placeholder="What's on your mind?" required></textarea>

          <button id="publishBtn" class="gold-btn full" type="submit">

            Publish post

          </button>

        </form>

      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;

        gap:10px;margin:24px 3px 15px">

        <h2>Community feed</h2>

        <button id="refreshBtn" class="dark-btn" type="button">Refresh</button>

      </div>

      <div id="feed">

        <div class="status">Loading posts...</div>

      </div>

    </section>

  </main>

  <footer>GOLDEN © 2026 · Connect. Share. Shine.</footer>

  <script>

    // Replace the placeholder below with your FULL Supabase publishable key.

    // Never put a service_role key or secret key in this website.

    const SUPABASE_URL = "https://xzifyfuukilypdwevgsu.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_ULjB2n30OSkgCcou4loujQ_0NufpGBY";

    const authSection = document.getElementById("authSection");

    const appSection = document.getElementById("appSection");

    const authForm = document.getElementById("authForm");

    const authMessage = document.getElementById("authMessage");

    const postMessage = document.getElementById("postMessage");

    let isLogin = false;

    let currentUser = null;

    let profileCache = {};

    function showMessage(element, text, type) {

      element.textContent = text;

      element.className = "message " + type;

    }

    function clearMessage(element) {

      element.textContent = "";

      element.className = "message";

    }

    function setBusy(button, busy, busyText, normalText) {

      button.disabled = busy;

      button.textContent = busy ? busyText : normalText;

    }

    function makeUsername(email) {

      return (email.split("@")[0] || "golden_user")

        .replace(/[^a-zA-Z0-9_]/g, "_")

        .slice(0, 24);

    }

    function escapeHTML(value) {

      return String(value ?? "").replace(/[&<>"']/g, char => ({

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#39;"

      })[char]);

    }

    function formatDate(value) {

      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString();

    }

    function updateAuthMode() {

      document.getElementById("authTitle").textContent =

        isLogin ? "Welcome back" : "Join GOLDEN";

      document.getElementById("authSubtitle").textContent =

        isLogin ? "Log in to your account." :

        "Create your account and connect with people.";

      document.getElementById("usernameField").classList.toggle("hidden", isLogin);

      document.getElementById("username").required = !isLogin;

      document.getElementById("authSubmit").textContent =

        isLogin ? "Log in" : "Create account";

      document.getElementById("switchText").textContent =

        isLogin ? "New to GOLDEN?" : "Already have an account?";

      document.getElementById("switchAuth").textContent =

        isLogin ? "Create account" : "Log in";

      document.getElementById("password").autocomplete =

        isLogin ? "current-password" : "new-password";

      clearMessage(authMessage);

    }

    document.getElementById("switchAuth").addEventListener("click", () => {

      isLogin = !isLogin;

      updateAuthMode();

    });

    function showLoggedOut() {

      currentUser = null;

      authSection.classList.remove("hidden");

      appSection.classList.add("hidden");

      document.getElementById("logoutBtn").classList.add("hidden");

    }

    async function showLoggedIn(user) {

      currentUser = user;

      authSection.classList.add("hidden");

      appSection.classList.remove("hidden");

      document.getElementById("logoutBtn").classList.remove("hidden");

      document.getElementById("welcomeTitle").textContent =

        "Welcome to GOLDEN, " + makeUsername(user.email || "golden").replace(/_/g, " ");

      await ensureProfile(user);

      await loadFeed();

    }

    async function ensureProfile(user) {

      const usernameInput = document.getElementById("username").value.trim();

      const username = usernameInput || makeUsername(user.email || "golden_user");

      // Profiles may already be created by a database trigger.

      const { data: existing, error: lookupError } = await db

        .from("profiles")

        .select("id, username")

        .eq("id", user.id)

        .maybeSingle();

      if (lookupError) {

        console.error("Profile lookup:", lookupError.message);

        return;

      }

      if (existing) {

        profileCache[user.id] = existing;

        document.getElementById("welcomeTitle").textContent =

          "Welcome to GOLDEN, " + (existing.username || username);

        return;

      }

      const { data, error } = await db

        .from("profiles")

        .insert({ id: user.id, username: username })

        .select("id, username")

        .single();

      if (error) {

        // A database trigger might have created the profile at the same time.

        console.error("Profile creation:", error.message);

        return;

      }

      profileCache[user.id] = data;

      document.getElementById("welcomeTitle").textContent =

        "Welcome to GOLDEN, " + (data.username || username);

    }

    authForm.addEventListener("submit", async event => {

      event.preventDefault();

      clearMessage(authMessage);

      if (!db) {

        showMessage(authMessage,

          "Setup needed: enter your full Supabase publishable key in the code.",

          "error");

        return;

      }

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      const username = document.getElementById("username").value.trim();

      const button = document.getElementById("authSubmit");

      if (!isLogin && !/^[a-zA-Z0-9_]{3,24}$/.test(username)) {

        showMessage(authMessage,

          "Use 3–24 characters for your username: letters, numbers or underscores.",

          "error");

        return;

      }

      setBusy(button, true, "Please wait...", isLogin ? "Log in" : "Create account");

      try {

        if (isLogin) {

          const { data, error } = await db.auth.signInWithPassword({

            email,

            password

          });

          if (error) throw error;

          await showLoggedIn(data.user);

        } else {

          const { data, error } = await db.auth.signUp({

            email,

            password,

            options: {

              data: { username }

            }

          });

          if (error) throw error;

          if (data.session && data.user) {

            await showLoggedIn(data.user);

          } else {

            showMessage(authMessage,

              "Account request received! Check your email for the confirmation link, then return here and log in.",

              "success");

            isLogin = true;

            updateAuthMode();

          }

        }

      } catch (error) {

        showMessage(authMessage, error.message || "Something went wrong.", "error");

      } finally {

        setBusy(button, false, "", isLogin ? "Log in" : "Create account");

      }

    });

    async function loadFeed() {

      const feed = document.getElementById("feed");

      feed.innerHTML = '<div class="status">Loading posts...</div>';

      try {

        const { data: posts, error } = await db

          .from("posts")

          .select("*")

          .order("created_at", { ascending: false })

          .limit(50);

        if (error) throw error;

        if (!posts || posts.length === 0) {

          feed.innerHTML =

            '<div class="panel status">No posts yet. Be the first to share something!</div>';

          return;

        }

        const userIds = [...new Set(posts.map(post => post.user_id).filter(Boolean))];

        const { data: profiles, error: profilesError } = await db

          .from("profiles")

          .select("id, username")

          .in("id", userIds);

        if (profilesError) console.error("Profile loading:", profilesError.message);

        profileCache = {};

        (profiles || []).forEach(profile => {

          profileCache[profile.id] = profile;

        });

        const { data: likes, error: likesError } = await db

          .from("likes")

          .select("post_id, user_id")

          .in("post_id", posts.map(post => post.id));

        if (likesError) console.error("Likes loading:", likesError.message);

        feed.innerHTML = posts.map(post => {

          const profile = profileCache[post.user_id];

          const username = profile?.username || "GOLDEN member";

          const postLikes = (likes || []).filter(like => like.post_id === post.id);

          const likedByMe = postLikes.some(like => like.user_id === currentUser.id);

          const initials = username.slice(0, 1).toUpperCase();

          return `

            <article class="post">

              <div class="post-head">

                <div class="avatar">${escapeHTML(initials)}</div>

                <div>

                  <div class="post-name">${escapeHTML(username)}</div>

                  <div class="post-time">${escapeHTML(formatDate(post.created_at))}</div>

                </div>

              </div>

              <div class="post-content">${escapeHTML(post.content)}</div>

              <div class="post-actions">

                <button class="dark-btn" type="button"

                  data-like="${escapeHTML(post.id)}">

                  ${likedByMe ? "♥ Liked" : "♡ Like"} (${postLikes.length})

                </button>

              </div>

            </article>

          `;

        }).join("");

      } catch (error) {

        console.error("Feed error:", error);

        feed.innerHTML = `

          <div class="panel">

            <p>We couldn't load the feed.</p>

            <p class="muted">${escapeHTML(error.message)}</p>

            <p class="muted">Check your Supabase tables and Row Level Security policies.</p>

          </div>`;

      }

    }

    document.getElementById("postForm").addEventListener("submit", async event => {

      event.preventDefault();

      clearMessage(postMessage);

      const content = document.getElementById("postContent").value.trim();

      if (!content) return;

      const button = document.getElementById("publishBtn");

      setBusy(button, true, "Publishing...", "Publish post");

      try {

        const { error } = await db.from("posts").insert({

          user_id: currentUser.id,

          content

        });

        if (error) throw error;

        document.getElementById("postContent").value = "";

        showMessage(postMessage, "Your post has been published!", "success");

        await loadFeed();

      } catch (error) {

        showMessage(postMessage, error.message || "Could not publish post.", "error");

      } finally {

        setBusy(button, false, "", "Publish post");

      }

    });

    document.getElementById("feed").addEventListener("click", async event => {

      const button = event.target.closest("[data-like]");

      if (!button) return;

      const postId = button.getAttribute("data-like");

      button.disabled = true;

      try {

        const { data: existing, error: lookupError } = await db

          .from("likes")

          .select("post_id")

          .eq("post_id", postId)

          .eq("user_id", currentUser.id)

          .maybeSingle();

        if (lookupError) throw lookupError;

        if (existing) {

          const { error } = await db.from("likes")

            .delete()

            .eq("post_id", postId)

            .eq("user_id", currentUser.id);

          if (error) throw error;

        } else {

          const { error } = await db.from("likes").insert({

            post_id: postId,

            user_id: currentUser.id

          });

          if (error) throw error;

        }

        await loadFeed();

      } catch (error) {

        alert("Couldn't update like: " + (error.message || "Please try again."));

        button.disabled = false;

      }

    });

    document.getElementById("refreshBtn").addEventListener("click", loadFeed);

    document.getElementById("logoutBtn").addEventListener("click", async () => {

      const { error } = await db.auth.signOut();

      if (error) {

        alert("Could not log out: " + error.message);

        return;

      }

      showLoggedOut();

    });

    let db = null;

    if (

      window.supabase &&

      SUPABASE_URL.startsWith("https://") &&

      SUPABASE_ANON_KEY.startsWith("sb_publishable_") &&

      SUPABASE_ANON_KEY.length > 25

    ) {

      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    } else {

      showMessage(authMessage,

        "Setup needed: replace the publishable-key placeholder in index.html with your full Supabase publishable key.",

        "error");

    }

    async function startApp() {

      if (!db) return;

      try {

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (data.session?.user) {

          await showLoggedIn(data.session.user);

        } else {

          showLoggedOut();

        }

        db.auth.onAuthStateChange((event, session) => {

          if (event === "SIGNED_OUT" || !session) {

            showLoggedOut();

          }

        });

      } catch (error) {

        showMessage(authMessage, error.message || "Could not connect to Supabase.", "error");

      }

    }

    startApp();

  </script>

</body>

</html>
