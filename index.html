
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GOLDEN Social</title>
<style>
:root {
  --bg:#000;
  --card:#080808;
  --line:#202020;
  --text:#f4f4f4;
  --muted:#89909e;
  --gold:#f5c84c;
  --blue:#1d9bf0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.6}
#auth{max-width:430px;margin:30px auto;padding:20px}
.brand{text-align:center;color:var(--gold);font-size:40px;font-weight:900;letter-spacing:7px;margin:20px 0 6px}
.tagline{text-align:center;color:#999;margin:8px 0 28px}
.authbox{padding:22px;border:1px solid #292929;border-radius:20px;background:#090909}
.auth-tabs{display:flex;gap:10px;margin-bottom:20px}
.auth-tabs button{flex:1;padding:12px;background:#171717;border:1px solid #333;color:white;border-radius:12px}
.auth-tabs button.active{background:var(--gold);color:#000;border-color:var(--gold)}
label{display:block;margin:16px 0 7px;font-size:14px}
.authbox input{width:100%;padding:14px;background:#111;color:white;border:1px solid #383838;border-radius:10px}
.goldbtn{border:0;background:var(--gold);color:#000;border-radius:28px;padding:13px 20px;font-weight:800}
.authbox .goldbtn{width:100%;margin-top:22px}
.notice{margin-top:14px;padding:12px;border-radius:9px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.error{background:#351414;color:#ffc2c2}
.success{background:#102819;color:#b7f7c2}
.muted{color:var(--muted)}
#connection{font-size:12px;text-align:center;margin-top:15px}
#app{max-width:800px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#000e;backdrop-filter:blur(14px)}
.topbar{height:77px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:0 20px}
.profile-button,.add-friend{border:0;background:transparent;color:white;font-size:26px}
.profile-button{display:flex;align-items:center;justify-content:flex-start}
.add-friend{text-align:right}
.logo{text-align:center;font-size:35px;font-weight:950;letter-spacing:6px;color:var(--gold)}
.avatar{width:54px;height:54px;min-width:54px;border-radius:50%;border:2px solid var(--gold);background:#191919;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.tabs{height:54px;display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:100px;position:relative;border:0;background:transparent;color:#a5a7af;font-weight:750;font-size:16px}
.tabs button.active{color:white}
.tabs button.active:after{content:"";position:absolute;bottom:0;left:14%;right:14%;height:3px;border-radius:4px;background:var(--gold)}
.composer{display:flex;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.composer .avatar{width:48px;height:48px;min-width:48px}
.composebody{flex:1;min-width:0}
textarea{width:100%;min-height:65px;resize:vertical;background:transparent;border:0;outline:none;color:white;font-size:17px;padding:8px 0}
.composefoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #1b1b1b;padding-top:10px;gap:10px}
.composefoot .muted{font-size:12px}
.post{padding:18px 20px 10px;border-bottom:1px solid var(--line);display:flex;gap:13px}
.post .avatar{width:55px;height:55px;min-width:55px}
.postmain{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;line-height:1.5}
.name{font-weight:850;color:#fff}
.handle,.time{color:var(--muted)}
.verified{color:var(--blue);font-size:14px}
.dots{margin-left:auto;border:0;background:transparent;color:#a3a8b4}
.posttext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:16px;margin:7px 0 12px}
.tags{color:var(--gold);font-size:14px;margin:10px 0 13px;line-height:1.8}
.tag{display:inline-block;background:#17140a;border-radius:18px;padding:2px 10px;margin:0 4px 3px 0}
.actions{display:flex;align-items:center;justify-content:space-between;gap:2px}
.action{border:0;background:transparent;color:#9ba6ba;padding:6px 0;font-size:13px;display:flex;align-items:center;gap:5px}
.action .symbol{font-size:21px}
.action:hover{color:var(--gold)}
.action.liked{color:#ff5791}
.action.reposted{color:var(--gold)}
.promo{margin:20px;padding:20px;border:1px solid #544522;border-radius:17px;background:radial-gradient(ellipse at right,#241b08 0%,#080808 62%);display:flex;gap:13px;align-items:flex-start}
.promoicon{font-size:35px;color:var(--gold)}
.promo h3{margin:3px 0 10px;font-size:20px}
.promo p{color:#bbb;line-height:1.5;margin:0 0 15px;font-size:14px}
.outlinebtn{border:1px solid var(--gold);border-radius:25px;padding:10px 16px;color:var(--gold);background:transparent;font-weight:750}
.empty{text-align:center;padding:45px 20px;color:var(--muted);line-height:1.6}
.pageheading{padding:20px;border-bottom:1px solid var(--line)}
.pageheading h2{margin:0 0 8px}
.fab{position:fixed;z-index:7;right:max(24px,calc((100vw - 760px)/2 + 24px));bottom:calc(90px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--gold);color:#090909;font-size:38px;box-shadow:0 5px 22px #0009}
.bottomnav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#000f;border-top:1px solid #242424}
.bottomnav button{flex:1;height:100%;border:0;background:transparent;color:#b3b6c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.bottomnav .navicon{font-size:25px;line-height:1.1}
.bottomnav button.active{color:var(--gold)}
.bottomnav button.active .navlabel{font-weight:800}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;padding:12px 18px;background:#242424;color:white;border:1px solid #414141;border-radius:12px;font-size:14px}
@media(min-width:801px){#app{border-left:1px solid #222;border-right:1px solid #222}.bottomnav{max-width:800px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}
@media(max-width:430px){.topbar{padding:0 15px;grid-template-columns:55px 1fr 55px}.logo{font-size:30px;letter-spacing:5px}.tabs button{font-size:15px;min-width:95px}.post{padding:16px 13px 9px;gap:10px}.post .avatar{width:47px;height:47px;min-width:47px}.posttext{font-size:15px}.actions{gap:0}.action{font-size:12px}.action .symbol{font-size:20px}.composer{padding:14px}.promo{margin:15px;padding:16px}}
</style>
</head>
<body>

<section id="auth">
  <div class="brand">GOLDEN</div>
  <p class="tagline">Your people. Your moments. Your community.</p>
  <div class="authbox">
    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">Log in</button>
      <button id="signupTab" type="button">Create account</button>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="muted" id="authSubtitle">Log in to continue to GOLDEN.</p>
    <form id="authForm">
      <div id="nameWrap" class="hidden">
        <label for="fullName">Your name</label>
        <input id="fullName" maxlength="80" autocomplete="name" placeholder="Your name">
      </div>
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters">
      <button id="authSubmit" class="goldbtn" type="submit">Log in</button>
    </form>
    <div id="authMessage" class="notice hidden" role="status"></div>
    <p class="muted">If email confirmation is enabled, confirm your email before logging in.</p>
    <p id="connection" class="muted">Connecting securely…</p>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="topbar">
      <button class="profile-button" id="topProfile" aria-label="Your profile">
        <span class="avatar" id="topAvatar">G</span>
      </button>
      <div class="logo">GOLDEN</div>
      <button class="add-friend" id="findPeople" aria-label="Find people">♙<sup>+</sup></button>
    </div>
    <nav class="tabs" id="feedTabs">
      <button class="active" data-feed="for-you">For You</button>
      <button data-feed="following">Following</button>
      <button data-feed="discover">Discover</button>
    </nav>
  </header>

  <section class="composer" id="composer">
    <div class="avatar" id="composeAvatar">G</div>
    <div class="composebody">
      <textarea id="postText" maxlength="500" placeholder="What is happening?"></textarea>
      <div class="composefoot">
        <span class="muted" id="charCount">0/500</span>
        <button class="goldbtn" id="publish">Post</button>
      </div>
      <div id="postMessage" class="notice hidden"></div>
    </div>
  </section>

  <section id="pageHeading" class="pageheading hidden">
    <h2 id="pageTitle"></h2>
    <p class="muted" id="pageSubtitle"></p>
  </section>

  <main id="posts"></main>
</section>

<button id="fab" class="fab hidden" aria-label="Create post">+</button>

<nav id="bottomnav" class="bottomnav hidden">
  <button class="active" data-page="home"><span class="navicon">⌂</span><span class="navlabel">Home</span></button>
  <button data-page="search"><span class="navicon">⌕</span><span class="navlabel">Search</span></button>
  <button data-page="community"><span class="navicon">◉</span><span class="navlabel">Community</span></button>
  <button data-page="notifications"><span class="navicon">♧</span><span class="navlabel">Notifications</span></button>
  <button data-page="messages"><span class="navicon">▢</span><span class="navlabel">Messages</span></button>
</nav>
<div id="toast" class="hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  // Your Supabase project connection
  const SUPABASE_URL = "https://xzifyfuukilypdwevgsu.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ULjB2n30OSkgCcou4loujQ_0NufpGBY";

  const $ = id => document.getElementById(id);
  let sb = null, user = null, authMode = "login", activeFeed = "for-you", activePage = "home";
  let posts = [];
  const liked = new Set();
  const reposted = new Set();

  function alertBox(el, text, type="error") {
    el.textContent = text;
    el.className = "notice " + type;
  }
  function clearAlert(el) {
    el.textContent = "";
    el.className = "notice hidden";
  }
  function toast(text) {
    $("toast").textContent = text;
    $("toast").classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => $("toast").classList.add("hidden"), 3000);
  }
  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }
  function getName(account=user) {
    return account?.user_metadata?.full_name || account?.email?.split("@")[0] || "GOLDEN member";
  }
  function setAuthMode(mode) {
    authMode = mode;
    const signup = mode === "signup";
    $("loginTab").classList.toggle("active", !signup);
    $("signupTab").classList.toggle("active", signup);
    $("nameWrap").classList.toggle("hidden", !signup);
    $("fullName").required = signup;
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("authTitle").textContent = signup ? "Join GOLDEN" : "Welcome back";
    $("authSubtitle").textContent = signup ? "Create your free account." : "Log in to continue to GOLDEN.";
    $("authSubmit").textContent = signup ? "Create account" : "Log in";
    clearAlert($("authMessage"));
  }
  function showApp(account) {
    user = account;
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("fab").classList.remove("hidden");
    $("bottomnav").classList.remove("hidden");
    const name = getName(account);
    $("topAvatar").textContent = name.charAt(0).toUpperCase();
    $("composeAvatar").textContent = name.charAt(0).toUpperCase();
    render();
  }
  function showAuth() {
    $("auth").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("fab").classList.add("hidden");
    $("bottomnav").classList.add("hidden");
  }

  $("loginTab").addEventListener("click", () => setAuthMode("login"));
  $("signupTab").addEventListener("click", () => setAuthMode("signup"));

  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!sb) return alertBox($("authMessage"), "Supabase is not connected. Refresh the page and check your internet.");
    const button = $("authSubmit");
    button.disabled = true;
    button.textContent = "Please wait…";
    clearAlert($("authMessage"));

    try {
      const email = $("email").value.trim();
      const password = $("password").value;
      let result;

      if (authMode === "signup") {
        const fullName = $("fullName").value.trim();
        if (!fullName) throw new Error("Please enter your name.");
        result = await sb.auth.signUp({
          email, password,
          options: { data: { full_name: fullName } }
        });
        if (result.error) throw result.error;
        if (result.data.session && result.data.user) {
          showApp(result.data.user);
          toast("Welcome to GOLDEN!");
        } else {
          alertBox($("authMessage"), "Account request received. Check your email for a confirmation link, then log in.", "success");
        }
      } else {
        result = await sb.auth.signInWithPassword({ email, password });
        if (result.error) throw result.error;
        if (result.data.user) showApp(result.data.user);
      }
    } catch (error) {
      alertBox($("authMessage"), error.message || "Authentication failed.");
    } finally {
      button.disabled = false;
      button.textContent = authMode === "signup" ? "Create account" : "Log in";
    }
  });

  $("postText").addEventListener("input", () => {
    $("charCount").textContent = $("postText").value.length + "/500";
  });

  // Demonstration posts: replace with real database posts when schema is connected.
  function seedDemoPosts() {
    posts = [
      {
        id:"demo1", uid:"demo-ocean", name:"OceanMind", handle:"OceanMind", time:"3h",
        text:"Good music hits different when the world feels heavy. 🎧\n\nRight now I’m on a classic run — old school vibes, new perspective.",
        tags:["Music","GoodVibes","Life"], category:"for-you", demo:true
      },
      {
        id:"demo2", uid:"demo-luna", name:"LunaRae", handle:"LunaRae", time:"5h",
        text:"Finally finished that workout 💪\n\nFresh air, good music, and a clear mind. That’s the kind of day I want more of.",
        tags:["Wellness","DailyLife","Progress"], category:"for-you", demo:true
      },
      {
        id:"demo3", uid:"demo-jayden", name:"JaydenCore", handle:"JaydenCore", time:"7h",
        text:"Late night thoughts:\n\nThe best moments in life aren't planned. They just happen when you're open to them.",
        tags:["Mindset","Gratitude","RealTalk"], category:"for-you", demo:true
      }
    ];
  }

  function postMarkup(p) {
    const isLiked = liked.has(p.id);
    const isReposted = reposted.has(p.id);
    const initial = safe(getNameFromPost(p).charAt(0).toUpperCase());
    const tagHTML = (p.tags || []).map(tag => `<span class="tag">#${safe(tag)}</span>`).join("");
    return `<article class="post">
      <div class="avatar">${initial}</div>
      <div class="postmain">
        <div class="meta">
          <span class="name">${safe(p.name)}</span>
          <span class="handle">@${safe(p.handle)}</span>
          <span class="time">· ${safe(p.time)}</span>
          <button class="dots" data-action="more" data-id="${safe(p.id)}" aria-label="More options">••</button>
        </div>
        <div class="posttext">${safe(p.text)}</div>
        ${tagHTML ? `<div class="tags">${tagHTML}</div>` : ""}
        <div class="actions">
          <button class="action" data-action="reply" data-id="${safe(p.id)}"><span class="symbol">♡</span></button>
          <button class="action ${isReposted ? "reposted":""}" data-action="repost" data-id="${safe(p.id)}"><span class="symbol">⇄</span></button>
          <button class="action ${isLiked ? "liked":""}" data-action="like" data-id="${safe(p.id)}"><span class="symbol">${isLiked ? "♥" : "♡"}</span></button>
          <button class="action" data-action="views" data-id="${safe(p.id)}"><span class="symbol">▥</span></button>
          <button class="action" data-action="bookmark" data-id="${safe(p.id)}"><span class="symbol">♧</span></button>
          <button class="action" data-action="share" data-id="${safe(p.id)}"><span class="symbol">↗</span></button>
        </div>
      </div>
    </article>`;
  }
  function getNameFromPost(p) {
    return p.name || "GOLDEN member";
  }
  function render() {
    const heading = $("pageHeading");
    const composer = $("composer");
    const tabs = $("feedTabs");

    document.querySelectorAll("[data-page]").forEach(b => {
      b.classList.toggle("active", b.dataset.page === activePage);
    });
    document.querySelectorAll("[data-feed]").forEach(b => {
      b.classList.toggle("active", b.dataset.feed === activeFeed);
    });

    if (activePage !== "home") {
      composer.classList.add("hidden");
      tabs.classList.add("hidden");
      heading.classList.remove("hidden");
      const titles = {
        search:"Search GOLDEN", community:"Community",
        notifications:"Notifications", messages:"Messages", profile:"Your profile"
      };
      $("pageTitle").textContent = titles[activePage] || "GOLDEN";
      $("pageSubtitle").textContent = activePage === "profile"
        ? "Your account and posts"
        : "More GOLDEN features are coming soon.";
      if (activePage === "profile") {
        const mine = posts.filter(p => p.uid === user?.id);
        $("posts").innerHTML = mine.length
          ? mine.map(postMarkup).join("")
          : '<div class="empty">Your posts will appear here.</div>';
      } else {
        $("posts").innerHTML = '<div class="empty"><h2>' + safe(titles[activePage] || "GOLDEN") + '</h2><p>This section needs its next feature and database connection.</p></div>';
      }
      return;
    }

    composer.classList.remove("hidden");
    tabs.classList.remove("hidden");
    heading.classList.add("hidden");

    if (activeFeed === "following") {
      $("posts").innerHTML = '<div class="empty"><h2>Your Following feed</h2><p>Posts from people you follow will appear here once following is connected.</p></div>';
      return;
    }
    const visible = activeFeed === "discover"
      ? posts
      : posts.filter(p => p.category === "for-you" || !p.category);

    $("posts").innerHTML = visible.length
      ? visible.map(postMarkup).join("") +
        `<section class="promo">
          <div class="promoicon">◎</div>
          <div><h3>Discover more languages</h3>
          <p>Connect with people around the world by exploring posts in different languages.</p>
          <button class="outlinebtn" data-action="languages">Explore languages →</button></div>
        </section>`
      : '<div class="empty"><h2>Welcome to GOLDEN</h2><p>Be the first to share something with your community.</p></div>';
  }

  $("publish").addEventListener("click", () => {
    const text = $("postText").value.trim();
    if (!text) return toast("Write something before posting.");
    if (!user) return toast("Please log in first.");

    const tags = [...text.matchAll(/#([a-z0-9_]+)/gi)].map(m => m[1]);
    posts.unshift({
      id:"local-" + Date.now(),
      uid:user.id,
      name:getName(),
      handle:user.email.split("@")[0],
      text,
      tags,
      time:"now",
      category:"for-you",
      demo:false
    });
    $("postText").value = "";
    $("charCount").textContent = "0/500";
    activePage = "home";
    render();
    toast("Post added for this session. Permanent saving is not connected yet.");
  });

  $("posts").addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const id = button.dataset.id;
    const action = button.dataset.action;
    const post = posts.find(p => p.id === id);

    if (action === "like" && post) {
      liked.has(id) ? liked.delete(id) : liked.add(id);
      render();
    } else if (action === "repost") {
      reposted.has(id) ? reposted.delete(id) : reposted.add(id);
      render();
    } else if (action === "reply") {
      toast("Replies will be added when comments are connected.");
    } else if (action === "views") {
      toast("Post analytics will be available in a future update.");
    } else if (action === "bookmark") {
      toast("Bookmarks need permanent storage to be saved.");
    } else if (action === "more") {
      toast("Post options will be added in a future update.");
    } else if (action === "languages") {
      toast("Language preferences are coming soon.");
    } else if (action === "share" && post) {
      try {
        if (navigator.share) {
          await navigator.share({title:"GOLDEN", text:post.text, url:location.href});
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(post.text + "\n" + location.href);
          toast("Post copied to clipboard.");
        } else {
          toast("Sharing is not supported in this browser.");
        }
      } catch (e) {
        if (e.name !== "AbortError") toast("Could not share this post.");
      }
    }
  });

  $("fab").addEventListener("click", () => {
    activePage = "home";
    render();
    $("postText").focus();
    window.scrollTo({top:0,behavior:"smooth"});
  });
  $("topProfile").addEventListener("click", () => {
    activePage = "profile";
    render();
  });
  $("findPeople").addEventListener("click", () => {
    activePage = "community";
    render();
  });
  document.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      activePage = button.dataset.page;
      render();
    });
  });
  document.querySelectorAll("[data-feed]").forEach(button => {
    button.addEventListener("click", () => {
      activeFeed = button.dataset.feed;
      render();
    });
  });

  async function init() {
    try {
      if (!window.supabase) throw new Error("Supabase library failed to load. Check your connection.");
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const {data,error} = await sb.auth.getSession();
      if (error) throw error;
      $("connection").textContent = "Connection initialized.";
      seedDemoPosts();
      if (data.session?.user) showApp(data.session.user);
      else showAuth();

      sb.auth.onAuthStateChange((_event, session) => {
        if (session?.user) showApp(session.user);
        else {
          user = null;
          showAuth();
        }
      });
    } catch (error) {
      $("connection").textContent = "Connection failed.";
      alertBox($("authMessage"), "Setup error: " + (error.message || "Unknown error"));
    }
  }

  init();
})();
</script>
</body>
</html>
